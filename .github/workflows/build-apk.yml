name: Build & Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify active Java version
        run: java -version

      - name: Install Android SDK 36 & accept licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi

          mkdir -p "$SDK_ROOT/licenses"
          { yes || true; } | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          if [ ! -f "$SDK_ROOT/platforms/android-36/android.jar" ]; then
            echo "::error::Android SDK Platform 36 missing at $SDK_ROOT/platforms/android-36/android.jar"
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify Gradle version
        run: gradle --version

      - name: Generate temporary debug keystore
        run: |
          rm -f ./debug.keystore
          "$JAVA_HOME/bin/keytool" -genkeypair \
            -keystore ./debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -noprompt

          if [ ! -f ./debug.keystore ] || [ ! -s ./debug.keystore ]; then
            echo "::error::Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore generated cleanly."

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon --max-workers=2 -Dorg.gradle.configuration-cache=false 2>&1 | tee /tmp/gradle-build.log

      - name: Print build error summary on failure
        if: failure()
        run: |
          if [ -f /tmp/gradle-build.log ]; then
            echo "=== FAILURE SUMMARY ==="
            grep -nE "FAILURE:|What went wrong:|Execution failed for task|Caused by:|e: file://|ERROR:" /tmp/gradle-build.log | head -n 40 || true
            echo "=== LAST 60 LOG LINES ==="
            tail -n 60 /tmp/gradle-build.log || true
          fi

      - name: Verify debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected debug APK missing at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK paths discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::$APK_PATH is not a regular file."
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::$APK_PATH is empty."
            exit 1
          fi

          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "::error::$APK_PATH does not have a .apk extension."
              exit 1
              ;;
          esac

          echo "Verified debug APK: $APK_PATH"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(printf '%s' "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          RELEASE_ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_DIR=$(mktemp -d "${{ runner.temp }}/apk-release-XXXXXX")
          RELEASE_ASSET_PATH="${RELEASE_DIR}/${RELEASE_ASSET_NAME}"

          cp "$SOURCE_APK" "$RELEASE_ASSET_PATH"

          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "::error::Prepared release asset missing or empty at $RELEASE_ASSET_PATH"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          {
            echo "asset_path=${RELEASE_ASSET_PATH}"
            echo "asset_name=${RELEASE_ASSET_NAME}"
            echo "release_tag=${RELEASE_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
          RELEASE_TAG: ${{ steps.prepare_asset.outputs.release_tag }}
        run: |
          gh --version

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release APK missing or empty: $ASSET_PATH"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::error::Prepared release asset does not have .apk extension: $ASSET_PATH"
              exit 1
              ;;
          esac

          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          printf -v RELEASE_NOTES '%s\n' \
            "Automatically generated debug APK built by GitHub Actions." \
            "" \
            "- **Workflow Run Number:** ${GITHUB_RUN_NUMBER}" \
            "- **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}" \
            "- **Source Commit SHA:** ${GITHUB_SHA}" \
            "- **Artifact Filename:** \`${ASSET_NAME}\`" \
            "" \
            "> **Testing Notice:** This APK is intended for testing only. It is not a Play Store production release and is signed only with a temporary debug keystore."

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: ${{ always() && steps.upload_artifact.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare_asset.outputs.release_tag }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
        run: |
          if [ "$PUBLISH_OUTCOME" = "success" ] && gh release view "$RELEASE_TAG" --json tagName,name,url,assets > /tmp/release_info.json 2>/dev/null; then
            TAG=$(jq -r '.tagName' /tmp/release_info.json)
            TITLE=$(jq -r '.name' /tmp/release_info.json)
            URL=$(jq -r '.url' /tmp/release_info.json)
            ASSET_FOUND=$(jq -r --arg name "$ASSET_NAME" '[.assets[].name] | index($name) != null' /tmp/release_info.json)

            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "Release Page URL: $URL"
            echo "APK Asset Filename: $ASSET_NAME"
            echo "Asset Attached: $ASSET_FOUND"

            {
              echo "## Debug APK Release Published"
              echo ""
              echo "- **Release Tag:** \`$TAG\`"
              echo "- **Release Title:** $TITLE"
              echo "- **APK Asset:** \`$ASSET_NAME\`"
              echo "- **Direct Release Page:** $URL"
              echo ""
              echo "Download the APK directly from the **Assets** section on the GitHub Release page above."
              echo "The standard GitHub Actions artifact (\`app-debug-apk\`) is also available on this workflow run as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed for tag ${RELEASE_TAG}. The APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available for download."
            {
              echo "## Debug APK Build Succeeded (Release Publishing Warning)"
              echo ""
              echo "> **Warning:** Publishing to GitHub Releases did not succeed."
              echo ""
              echo "- **APK Build Status:** Succeeded"
              echo "- **Backup Download:** Download the GitHub Actions artifact named \`app-debug-apk\` from this workflow run's **Artifacts** section."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Clean up temporary files
        if: always()
        run: rm -f ./debug.keystore /tmp/release_info.json /tmp/gradle-build.log
