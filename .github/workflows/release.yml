name: Build & Publish SONORA Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string
      release_name:
        description: "Release title (optional)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36 & accept licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi

          mkdir -p "$SDK_ROOT/licenses"
          { yes || true; } | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          if [ ! -f "$SDK_ROOT/platforms/android-36/android.jar" ]; then
            echo "::error::Android SDK Platform 36 missing at $SDK_ROOT/platforms/android-36/android.jar"
            exit 1
          fi

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required GitHub Actions secrets: KEYSTORE_BASE64, STORE_PASSWORD, and/or KEY_PASSWORD."
            echo "Create a keystore with keyAlias 'upload':"
            echo "  keytool -genkeypair -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload"
            echo "Then base64-encode my-upload-key.jks into KEYSTORE_BASE64 and set STORE_PASSWORD & KEY_PASSWORD in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ runner.temp }}/my-upload-key.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$KEYSTORE_FILE"
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace --max-workers=2 -Dorg.gradle.configuration-cache=false

      - name: Prepare release APK asset
        id: release_vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
            TITLE="${{ inputs.release_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
            TITLE=""
          fi
          if [ -z "$TITLE" ]; then
            TITLE="SONORA $TAG"
          fi
          mkdir -p "${{ runner.temp }}/release-assets"
          APK_SRC=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "::error::No release APK found in app/build/outputs/apk/release"
            exit 1
          fi
          APK_OUT="${{ runner.temp }}/release-assets/SONORA-${TAG}.apk"
          cp "$APK_SRC" "$APK_OUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$TITLE" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK_OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonora-release-apk
          path: ${{ steps.release_vars.outputs.apk_path }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_vars.outputs.tag_name }}
          name: ${{ steps.release_vars.outputs.release_name }}
          generate_release_notes: true
          files: ${{ steps.release_vars.outputs.apk_path }}

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${{ runner.temp }}/my-upload-key.jks"
